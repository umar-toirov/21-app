version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ilmmode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ilmmode
      ENVIRONMENT: development
      SUPABASE_JWT_SECRET: dev-secret-change-in-production
      INTERNAL_JOB_SECRET: change-me-in-production
      CORS_ORIGINS: "*"
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
