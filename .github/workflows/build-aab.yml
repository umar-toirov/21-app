name: Build Play Store bundle

# Manual: Actions -> "Build Play Store bundle" -> Run workflow.
# Needs repo secrets: UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS,
# UPLOAD_KEY_PASSWORD, and repo variables API_BASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY.
# See docs/PLAY_STORE.md.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write env config
        working-directory: mobile
        run: |
          cat > env.production.json <<'EOF2'
          {
            "API_BASE_URL": "${{ vars.API_BASE_URL }}",
            "SUPABASE_URL": "${{ vars.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ vars.SUPABASE_ANON_KEY }}"
          }
          EOF2

      - name: Write upload key
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}"
          } > key.properties

      - run: flutter pub get
        working-directory: mobile

      - run: flutter build appbundle --release --dart-define-from-file=env.production.json
        working-directory: mobile

      - uses: actions/upload-artifact@v4
        with:
          name: habit-zone-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
