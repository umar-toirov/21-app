[project]
name = "ilm-mode-api"
version = "1.0.0"
description = "ILM Mode discipline platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, so CI stays green regardless of which ruff version pip resolves
# (an unpinned "latest" install once picked up extra rule families here —
# e.g. flake8-bugbear's B008, which flags FastAPI's own `Depends(...)`
# default-argument pattern used throughout this app — that aren't part of
# ruff's documented stable defaults).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
